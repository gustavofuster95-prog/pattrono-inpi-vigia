name: Vigia INPI Pattrono

on:
  schedule:
    - cron: '0 22 * * 2'   # terca, 19:00 BRT
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar verificacao
        id: vigia
        run: python3 vigia_inpi.py

      - name: Salvar resultado no repositorio
        run: |
          git config user.name "vigia-inpi"
          git config user.email "actions@github.com"
          git add status.json last_run.md historico.md
          git diff --cached --quiet || git commit -m "Verificacao $(date -u +%Y-%m-%d)"
          git push

      - name: Abrir issue se houve MOVIMENTACAO
        if: steps.vigia.outputs.movimento == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔔 Movimentação nos pedidos INPI da Pattrono ($(date +%d/%m/%Y))" \
            --body-file last_run.md

      - name: Abrir issue se a verificacao FALHOU
        if: steps.vigia.outputs.erro == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Vigia INPI falhou em $(date +%d/%m/%Y)" \
            --body-file last_run.md
